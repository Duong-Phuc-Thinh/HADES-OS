<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5" fill="#020813" stroke="url(#cyanGlow)" stroke-width="4" filter="url(#glow)"/>
  <polygon points="50,15 85,32 85,68 50,85 15,68 15,32" fill="#051428" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>
  <circle cx="50" cy="50" r="14" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="7" fill="#020813"/>
</svg>
